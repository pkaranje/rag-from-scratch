[project]
name = "rag-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "cohere>=7.3.1",
    "docling>=2.148.0",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "flashrank>=0.2.10",
    "fpdf2>=2.9.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "langchain>=0.3",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.3",
    "langchain-core>=1.7.6",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.14",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=0.2",
    "matplotlib>=3.11.2",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "openai>=2.26.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pi-heif>=1.4.0",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "umap-learn>=0.5.12",
    "unstructured>=0.24.1",
    "unstructured-inference>=1.6.17",
    "unstructured-pytesseract>=0.3.15",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["."]
